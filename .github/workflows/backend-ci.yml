name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # IntegrationTestBase defaults to jdbc:postgresql://localhost:55432/mesaro
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: mesaro
          POSTGRES_USER: mesaro
          POSTGRES_PASSWORD: mesaro
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mesaro -d mesaro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit and integration tests
        run: ./mvnw -B test
        env:
          # Avoid requiring Redis for Spring Session during CI
          SESSION_STORE_TYPE: none

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
