name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Omen staging
    runs-on: [self-hosted, linux, mesaro-staging]
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync code to /opt/mesaro
        run: |
          set -euo pipefail
          mkdir -p /opt/mesaro
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'backend/.env.staging' \
            --exclude 'backend/frontend-dist/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'frontend/playwright-report/' \
            --exclude 'frontend/test-results/' \
            --exclude 'frontend/.env.production.local' \
            --exclude 'backend/target/' \
            "${GITHUB_WORKSPACE}/" /opt/mesaro/

      - name: Materialize staging env from GitHub Environment
        env:
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          MESARO_DOMAIN: ${{ vars.MESARO_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          FRONTEND_DIST_PATH: ${{ vars.FRONTEND_DIST_PATH }}
          MANAGEMENT_PORT: ${{ vars.MANAGEMENT_PORT }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_URL: ${{ vars.DB_URL }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_POOL_MIN_IDLE: ${{ vars.DB_POOL_MIN_IDLE }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SESSION_STORE_TYPE: ${{ vars.SESSION_STORE_TYPE }}
          ELASTICSEARCH_URIS: ${{ vars.ELASTICSEARCH_URIS }}
          ELASTICSEARCH_USERNAME: ${{ vars.ELASTICSEARCH_USERNAME }}
          ELASTICSEARCH_PASSWORD: ${{ secrets.ELASTICSEARCH_PASSWORD }}
          ELASTICSEARCH_HEALTH_ENABLED: ${{ vars.ELASTICSEARCH_HEALTH_ENABLED }}
          APP_LOG_ELASTIC_ENABLED: ${{ vars.APP_LOG_ELASTIC_ENABLED }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          HOLD_TOKEN_SECRET: ${{ secrets.HOLD_TOKEN_SECRET }}
          RESERVATION_TOKEN_SECRET: ${{ secrets.RESERVATION_TOKEN_SECRET }}
          STAFF_TOKEN_SECRET: ${{ secrets.STAFF_TOKEN_SECRET }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          API_CORS_ORIGINS: ${{ vars.API_CORS_ORIGINS }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_AUTH: ${{ vars.SMTP_AUTH }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          EMAIL_SUPPORT_ADDRESS: ${{ vars.EMAIL_SUPPORT_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_BASE_URL: ${{ vars.RESEND_API_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_SUCCESS_URL: ${{ vars.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL: ${{ vars.STRIPE_CANCEL_URL }}
          STRIPE_PORTAL_RETURN_URL: ${{ vars.STRIPE_PORTAL_RETURN_URL }}
        run: |
          set -euo pipefail
          # Required by docker-compose.prod.yml (${VAR?…}) — empty optional keys allowed.
          required=(
            SPRING_PROFILES_ACTIVE
            MESARO_DOMAIN
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            DB_URL
            DB_USER
            DB_PASS
            REDIS_HOST
            REDIS_PORT
            REDIS_PASSWORD
            JWT_SECRET
            HOLD_TOKEN_SECRET
            RESERVATION_TOKEN_SECRET
            STAFF_TOKEN_SECRET
            APP_BASE_URL
            API_BASE_URL
            FRONTEND_URL
            API_CORS_ORIGINS
            EMAIL_PROVIDER
            EMAIL_FROM
            EMAIL_SUPPORT_ADDRESS
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            STRIPE_PRICE_ID
          )
          missing=0
          for k in "${required[@]}"; do
            if [ -z "${!k:-}" ]; then
              echo "missing $k — add it on GitHub Environment 'staging' (Variable or Secret). See .github/environments/README.md" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p /opt/mesaro/backend
          umask 077
          env_file=/opt/mesaro/backend/.env.staging
          kv() { printf '%s=%s\n' "$1" "$2"; }
          {
            kv SPRING_PROFILES_ACTIVE "${SPRING_PROFILES_ACTIVE}"
            kv MESARO_DOMAIN "${MESARO_DOMAIN}"
            kv ACME_EMAIL "${ACME_EMAIL:-staging@mesaro.staging}"
            kv FRONTEND_DIST_PATH "${FRONTEND_DIST_PATH:-./frontend-dist}"
            kv MANAGEMENT_PORT "${MANAGEMENT_PORT:-9090}"
            kv POSTGRES_DB "${POSTGRES_DB}"
            kv POSTGRES_USER "${POSTGRES_USER}"
            kv POSTGRES_PASSWORD "${POSTGRES_PASSWORD}"
            kv DB_URL "${DB_URL}"
            kv DB_USER "${DB_USER}"
            kv DB_PASS "${DB_PASS}"
            kv DB_POOL_SIZE "${DB_POOL_SIZE:-20}"
            kv DB_POOL_MIN_IDLE "${DB_POOL_MIN_IDLE:-10}"
            kv REDIS_HOST "${REDIS_HOST}"
            kv REDIS_PORT "${REDIS_PORT}"
            kv REDIS_PASSWORD "${REDIS_PASSWORD}"
            kv SESSION_STORE_TYPE "${SESSION_STORE_TYPE:-redis}"
            kv ELASTICSEARCH_URIS "${ELASTICSEARCH_URIS:-}"
            kv ELASTICSEARCH_USERNAME "${ELASTICSEARCH_USERNAME:-}"
            kv ELASTICSEARCH_PASSWORD "${ELASTICSEARCH_PASSWORD:-}"
            kv ELASTICSEARCH_HEALTH_ENABLED "${ELASTICSEARCH_HEALTH_ENABLED:-false}"
            kv APP_LOG_ELASTIC_ENABLED "${APP_LOG_ELASTIC_ENABLED:-false}"
            kv JWT_SECRET "${JWT_SECRET}"
            kv HOLD_TOKEN_SECRET "${HOLD_TOKEN_SECRET}"
            kv RESERVATION_TOKEN_SECRET "${RESERVATION_TOKEN_SECRET}"
            kv STAFF_TOKEN_SECRET "${STAFF_TOKEN_SECRET}"
            kv APP_BASE_URL "${APP_BASE_URL}"
            kv API_BASE_URL "${API_BASE_URL}"
            kv FRONTEND_URL "${FRONTEND_URL}"
            kv API_CORS_ORIGINS "${API_CORS_ORIGINS}"
            kv EMAIL_PROVIDER "${EMAIL_PROVIDER}"
            kv SMTP_HOST "${SMTP_HOST:-}"
            kv SMTP_PORT "${SMTP_PORT:-1025}"
            kv SMTP_USERNAME "${SMTP_USERNAME:-}"
            kv SMTP_PASSWORD "${SMTP_PASSWORD:-}"
            kv SMTP_AUTH "${SMTP_AUTH:-false}"
            kv SMTP_STARTTLS "${SMTP_STARTTLS:-false}"
            kv EMAIL_FROM "${EMAIL_FROM}"
            kv EMAIL_FROM_NAME "${EMAIL_FROM_NAME:-Mesaro Staging}"
            kv EMAIL_SUPPORT_ADDRESS "${EMAIL_SUPPORT_ADDRESS}"
            kv RESEND_API_KEY "${RESEND_API_KEY:-}"
            kv RESEND_API_BASE_URL "${RESEND_API_BASE_URL:-https://api.resend.com}"
            kv STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY}"
            kv STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET}"
            kv STRIPE_PRICE_ID "${STRIPE_PRICE_ID}"
            kv STRIPE_SUCCESS_URL "${STRIPE_SUCCESS_URL:-}"
            kv STRIPE_CANCEL_URL "${STRIPE_CANCEL_URL:-}"
            kv STRIPE_PORTAL_RETURN_URL "${STRIPE_PORTAL_RETURN_URL:-}"
          } > "$env_file"
          chmod 600 "$env_file"
          echo "Wrote $env_file (mode 600) from GitHub Environment staging"

      - name: Build frontend
        working-directory: /opt/mesaro/frontend
        env:
          # Same origin as the SPA so one Caddy internal-cert accept covers API calls.
          # Must be in process.env: vite.config asserts VITE_API_URL at config-load time
          # (file-only .env.production.local is not always visible then).
          VITE_API_URL: https://app.mesaro.staging/api
        run: |
          set -euo pipefail
          printf '%s\n' "VITE_API_URL=${VITE_API_URL}" > .env.production.local
          npm ci
          npx vite build
          mkdir -p ../backend/frontend-dist
          rm -rf ../backend/frontend-dist/*
          cp -a dist/. ../backend/frontend-dist/

      - name: Deploy Compose stack
        working-directory: /opt/mesaro/backend
        run: |
          set -euo pipefail
          chmod +x mvnw
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.staging.yml \
            --env-file .env.staging \
            up -d --build

      - name: Readiness check
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19090/actuator/health/readiness; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for staging readiness" >&2
          docker compose \
            -f /opt/mesaro/backend/docker-compose.prod.yml \
            -f /opt/mesaro/backend/docker-compose.staging.yml \
            --env-file /opt/mesaro/backend/.env.staging \
            logs --tail=100 app-prod || true
          exit 1

  e2e-smoke:
    name: E2E smoke (staging)
    needs: deploy
    # Must run on Omen: app.mesaro.staging is LAN-only. Host Playwright browsers also
    # do not support Ubuntu 26.04 yet, so tests run in the official Playwright image.
    runs-on: [self-hosted, linux, mesaro-staging]
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run smoke tests against staging
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://app.mesaro.staging
          E2E_RESTAURANT_SLUG: ${{ vars.E2E_RESTAURANT_SLUG }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          staging_ip="$(hostname -I | awk '{print $1}')"
          if [ -z "$staging_ip" ]; then
            echo "Could not determine staging host IP for Docker --add-host" >&2
            exit 1
          fi
          # Run as the runner user so report dirs are not root-owned (rsync --delete would fail).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm-cache \
            --add-host="app.mesaro.staging:${staging_ip}" \
            --add-host="api.mesaro.staging:${staging_ip}" \
            -v "$PWD:/work" \
            -w /work \
            -e CI \
            -e PLAYWRIGHT_BASE_URL \
            -e E2E_RESTAURANT_SLUG \
            -e E2E_OWNER_EMAIL \
            -e E2E_OWNER_PASSWORD \
            -e E2E_MANAGER_EMAIL \
            -e E2E_MANAGER_PASSWORD \
            -e E2E_STAFF_EMAIL \
            -e E2E_STAFF_PASSWORD \
            mcr.microsoft.com/playwright:v1.58.2-jammy \
            bash -lc 'npm ci && npx playwright test --project=chromium --grep @smoke'

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-staging-smoke-report
          path: frontend/playwright-report
          if-no-files-found: ignore
