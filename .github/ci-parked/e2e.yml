name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start infra (Postgres + Redis)
        working-directory: backend
        run: |
          docker compose -f docker-compose.infra.yml up -d
          # Wait for Postgres readiness on published port if present
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.infra.yml ps | grep -qi healthy; then
              break
            fi
            sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright (Chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Spring Boot (dev profile)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: |
          nohup ./mvnw -B spring-boot:run -DskipTests > /tmp/mesaro-api.log 2>&1 &
          echo $! > /tmp/mesaro-api.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API failed to become healthy"
          tail -n 200 /tmp/mesaro-api.log || true
          exit 1

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8080
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: /tmp/mesaro-api.log

      - name: Stop API and infra
        if: always()
        working-directory: backend
        run: |
          if [ -f /tmp/mesaro-api.pid ]; then kill $(cat /tmp/mesaro-api.pid) || true; fi
          docker compose -f docker-compose.infra.yml down || true
