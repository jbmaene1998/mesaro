# =============================================================================
# Mesaro API - Infrastructure Only (for local development)
# =============================================================================
# Use this when running the app locally via IDE or Maven.
# Starts PostgreSQL, Redis, Elasticsearch, and Kibana.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres-dev:
    image: postgres:15-alpine
    container_name: mesaro-dev-postgres
    environment:
      POSTGRES_DB: mesaro_dev
      POSTGRES_USER: mesaro
      POSTGRES_PASSWORD: mesaro
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesaro -d mesaro_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis (Session Store)
  # ---------------------------------------------------------------------------
  redis-dev:
    image: redis:7-alpine
    container_name: mesaro-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Elasticsearch (Search Engine)
  # ---------------------------------------------------------------------------
  elasticsearch-dev:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: mesaro-dev-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata-dev:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kibana (Elasticsearch UI)
  # ---------------------------------------------------------------------------
  kibana-dev:
    image: docker.elastic.co/kibana/kibana:8.11.4
    container_name: mesaro-dev-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch-dev:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 45s

volumes:
  pgdata-dev:
    name: mesaro-dev-pgdata
  redisdata-dev:
    name: mesaro-dev-redisdata
  esdata-dev:
    name: mesaro-dev-esdata
