# =============================================================================
# Mesaro API - Production Configuration
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# REQUIRED environment variables for production:
#   - DB_URL, DB_USER, DB_PASS
#   - REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
#   - ELASTICSEARCH_URIS (and ELASTICSEARCH_USERNAME/ELASTICSEARCH_PASSWORD if secured)
#   - JWT_SECRET (min 256 bits / 32 chars)
#   - HOLD_TOKEN_SECRET, RESERVATION_TOKEN_SECRET, STAFF_TOKEN_SECRET
#   - EMAIL_FROM (non-blank)
#   - EMAIL_PROVIDER with matching provider credentials:
#       resend -> RESEND_API_KEY
#       smtp   -> SMTP_HOST; when SMTP_AUTH=true also SMTP_USERNAME and SMTP_PASSWORD
#   - APP_BASE_URL, API_BASE_URL, FRONTEND_URL
#   - API_CORS_ORIGINS
# =============================================================================

spring:
  datasource:
    # No defaults in production: must be provided via environment variables.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    clean-disabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholders:
      seed_demo_data: false

  # Ensure Redis session store in production
  session:
    store-type: redis

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

# Production actuator - hide sensitive details
management:
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false
    git:
      enabled: false

# Disable Swagger in production by default
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# Public traffic arrives through Caddy on the Docker bridge (172.16.0.0/12).
# Trust only that range so each guest gets their own limit. Do not add 10/8 or
# 192.168/16: those are client LANs, and treating them as proxies collapses
# every visitor back onto one shared bucket.
app:
  rate-limit:
    trust-forwarded-headers: true
    trusted-proxies:
      - ${RATE_LIMIT_TRUSTED_PROXY_CIDR:172.16.0.0/12}

# Production logging
logging:
  level:
    root: WARN
    com.mesaro: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: ERROR
