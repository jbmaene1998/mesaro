# =============================================================================
# Mesaro API - Development Configuration
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=dev (default)
# =============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mesaro_dev}
    username: ${DB_USER:mesaro}
    password: ${DB_PASS:mesaro}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/seed
    validate-on-migrate: false
    placeholders:
      seed_demo_data: true

  # Allow running without Redis in dev (fallback to in-memory sessions)
  session:
    store-type: ${SESSION_STORE_TYPE:none}

app:
  seed:
    refresh-on-startup: ${SEED_REFRESH_ON_STARTUP:true}

# Development logging - verbose
logging:
  level:
    com.mesaro: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
